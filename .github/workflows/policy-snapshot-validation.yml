name: Policy snapshot validation
on:
  pull_request:
    paths:
      - 'policy-snapshots/**'
      - 'tests/test_policy_snapshots.py'
      - '.github/workflows/policy-snapshot-validation.yml'
  push:
    branches: [main]
    paths:
      - 'policy-snapshots/**'
      - 'tests/test_policy_snapshots.py'
      - '.github/workflows/policy-snapshot-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.11'
      - name: Validate snapshots offline
        run: python -m unittest discover -s tests -p test_policy_snapshots.py -v
