name: Core evidence read-only diagnostic
on:
  workflow_dispatch:
permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read
  statuses: read
jobs:
  diagnose:
    if: >-
      github.ref == 'refs/heads/main' && github.repository_id == '1461539726' &&
      github.repository == 'djconnect-music-dj/.github' && github.actor_id == '19624891'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact public policy snapshot
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: djconnect-music-dj/.github
          ref: ${{ github.sha }}
          path: reconciliation-policy
          persist-credentials: false
      - id: collect
        name: Read back merge provenance and exact-SHA evidence
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          COVERAGE_ARTIFACT: ha-cobertura-coverage
          DISTRIBUTION_EVIDENCE_ARTIFACT: platform-release-distribution-integrity
          REQUIRED_MAIN_WORKFLOW: Validate Home Assistant custom integration
          REQUIRED_CHECK_CONTEXTS: '["Trusted Delivery qualification / Qualify trusted delivery"]'
          REPOSITORY_ROLE: active_source
        with:
          script: |
            const fs = require("fs");
            const owner = "djconnect-music-dj";
            const repo = "djconnect";
            const target = (await github.rest.repos.get({owner, repo})).data;
            if (target.id !== 1258575431 || target.private !== false || target.full_name !== `${owner}/${repo}`) throw new Error("Unexpected Core identity");
            const mainSha = (await github.rest.repos.getBranch({owner, repo, branch: "main"})).data.commit.sha;
            if (!/^[a-f0-9]{40}$/.test(mainSha)) throw new Error("Invalid Core main identity");
            const repositoryRole = process.env.REPOSITORY_ROLE;
            if (!["active_source", "release_source", "distribution"].includes(repositoryRole)) {
              throw new Error("repository_role is invalid");
            }
            const commit = await github.rest.repos.getCommit({owner, repo, ref: mainSha});
            // BEGIN exact-PR fallback. Two identical complete inventories detect
            // observed pagination drift; they are not an atomic GitHub snapshot.
            async function resolveOriginatingPR(github, owner, repo, mainSha) {
              const matches = pr => pr?.merged_at && pr.base?.ref === "main" &&
                pr.base?.repo?.full_name === `${owner}/${repo}` && pr.merge_commit_sha === mainSha &&
                Number.isSafeInteger(pr.number) && pr.number > 0;
              async function inventory(fetchPage, expectedPath) {
                const rows = [];
                const numbers = new Set();
                for (let page = 1; page <= 100; page++) {
                  const response = await fetchPage(page);
                  if (!Array.isArray(response.data)) throw new Error("Invalid PR inventory page");
                  for (const item of response.data) {
                    if (!Number.isSafeInteger(item.number) || item.number < 1 || numbers.has(item.number) ||
                        typeof item.updated_at !== "string") throw new Error("Incomplete or duplicate PR inventory");
                    numbers.add(item.number);
                    rows.push(item);
                  }
                  const link = response.headers?.link;
                  let next = null;
                  if (link !== undefined && link !== "") {
                    if (typeof link !== "string") throw new Error("Invalid pagination Link header");
                    const relations = new Set();
                    for (const entry of link.split(",")) {
                      const match = /^\s*<([^>]+)>;\s*rel="([a-z]+)"\s*$/.exec(entry);
                      if (!match || relations.has(match[2])) throw new Error("Malformed pagination Link header");
                      relations.add(match[2]);
                      if (match[2] === "next") next = match[1];
                    }
                  }
                  if (!next) {
                    if (response.data.length === 100) throw new Error("Full PR page without next link");
                    return rows;
                  }
                  let nextUrl;
                  try { nextUrl = new URL(next); } catch { throw new Error("Invalid next URL"); }
                  if (nextUrl.protocol !== "https:" || nextUrl.hostname !== "api.github.com" || nextUrl.port ||
                      nextUrl.username || nextUrl.password || nextUrl.hash || nextUrl.pathname !== expectedPath ||
                      nextUrl.searchParams.getAll("page").length !== 1 || nextUrl.searchParams.get("page") !== String(page + 1) ||
                      nextUrl.searchParams.getAll("per_page").length !== 1 || nextUrl.searchParams.get("per_page") !== "100")
                    throw new Error("Unexpected next URL");
                  if (!response.data.length || page === 100) throw new Error("Incomplete PR pagination");
                }
                throw new Error("PR pagination exceeds limit");
              }
              const assoc = await inventory(page => github.rest.repos.listPullRequestsAssociatedWithCommit(
                {owner, repo, commit_sha: mainSha, per_page: 100, page}), `/repos/${owner}/${repo}/commits/${mainSha}/pulls`);
              let candidates = assoc.filter(matches);
              if (candidates.length === 0) {
                const scan = () => inventory(page => github.rest.pulls.list(
                  {owner, repo, state: "closed", sort: "created", direction: "asc", per_page: 100, page}), `/repos/${owner}/${repo}/pulls`);
                const first = await scan();
                const second = await scan();
                const fingerprint = rows => JSON.stringify(rows.map(pr => [pr.number, pr.updated_at,
                  pr.merged_at, pr.merge_commit_sha, pr.base?.ref, pr.base?.repo?.full_name]));
                if (fingerprint(first) !== fingerprint(second)) throw new Error("PR inventory changed during pagination");
                candidates = second.filter(matches);
              }
              if (candidates.length !== 1) return null;
              const pr = await github.rest.pulls.get({owner, repo, pull_number: candidates[0].number});
              if (!matches(pr.data) || pr.data.number !== candidates[0].number || pr.data.merged !== true ||
                  !/^[0-9a-f]{40}$/.test(pr.data.head?.sha || "")) throw new Error("PR readback mismatch");
              return pr;
            }
            const pr = await resolveOriginatingPR(github, owner, repo, mainSha);
            // END exact-PR fallback.
            const prFiles = pr ? await github.paginate(github.rest.pulls.listFiles, {owner, repo, pull_number: pr.data.number, per_page: 100}) : [];
            const prContexts = pr ? await github.graphql(`query($owner:String!,$repo:String!,$sha:GitObjectID!){repository(owner:$owner,name:$repo){object(oid:$sha){... on Commit {statusCheckRollup {contexts(first:100){nodes{__typename ... on CheckRun{name status conclusion} ... on StatusContext{context state description}}}}}}}}`, {owner, repo, sha: pr.data.head.sha}) : null;
            const contextNodes = prContexts?.repository?.object?.statusCheckRollup?.contexts?.nodes || [];
            const checkPass = name => contextNodes.some(item => item.__typename === "CheckRun" && item.name === name && item.status === "COMPLETED" && item.conclusion === "SUCCESS");
            let requiredContexts;
            try {
              const configuredContexts = JSON.parse(process.env.REQUIRED_CHECK_CONTEXTS);
              if (!Array.isArray(configuredContexts) || configuredContexts.length === 0 || !configuredContexts.every(item => typeof item === "string" && item)) {
                throw new Error("required_check_contexts must be a non-empty JSON array of strings");
              }
              requiredContexts = new Set(configuredContexts);
            } catch (error) {
              throw new Error(`required_check_contexts is invalid: ${error.message}`);
            }
            const requiredCheckPass = name => contextNodes.some(item =>
              (item.__typename === "CheckRun" && item.name === name && item.status === "COMPLETED" && item.conclusion === "SUCCESS") ||
              (item.__typename === "StatusContext" && item.context === name && item.state === "SUCCESS")
            );
            const ownerStatus = contextNodes.find(item => item.__typename === "StatusContext" && item.context === "Owner Authorization");
            const risk = ownerStatus?.description?.startsWith("HIGH_RISK") ? "HIGH_RISK" : "NORMAL_RISK";
            // A name alone cannot bind CI or artifacts to the required execution.
            const repoId = target.id;
            if (!Number.isSafeInteger(repoId) || repoId <= 0) throw new Error("Repository identity unavailable");
            const readRuns = () => github.paginate(github.rest.actions.listWorkflowRunsForRepo, {owner, repo, head_sha: mainSha, per_page: 100});
            function newestRun(runs) {
              const candidates = runs.filter(run => run.name === process.env.REQUIRED_MAIN_WORKFLOW && run.head_sha === mainSha && run.event === "push" && run.head_branch === "main");
              if (candidates.some(run => !Number.isSafeInteger(run.id) || !Number.isSafeInteger(run.workflow_id) || !Number.isFinite(Date.parse(run.created_at)))) throw new Error("Incomplete CI run identity");
              if (new Set(candidates.map(run => run.id)).size !== candidates.length || new Set(candidates.map(run => run.workflow_id)).size > 1) throw new Error("Ambiguous CI workflow identity");
              candidates.sort((a,b) => Date.parse(b.created_at) - Date.parse(a.created_at));
              if (candidates.length > 1 && Date.parse(candidates[0].created_at) === Date.parse(candidates[1].created_at)) throw new Error("Ambiguous newest CI run");
              return candidates[0] || null;
            }
            const indexedRun = newestRun(await readRuns());
            const readRun = async () => indexedRun ? (await github.rest.actions.getWorkflowRun({owner, repo, run_id: indexedRun.id})).data : null;
            const verifiedRun = await readRun();
            const validRun = run => Boolean(run && indexedRun && run.id === indexedRun.id && run.workflow_id === indexedRun.workflow_id && run.name === process.env.REQUIRED_MAIN_WORKFLOW && run.created_at === indexedRun.created_at && run.head_sha === mainSha && run.head_branch === "main" && run.event === "push" && run.repository?.id === repoId && run.head_repository?.id === repoId && run.status === "completed" && run.conclusion === "success" && run.run_attempt === 1 && Number.isFinite(Date.parse(run.run_started_at)));
            const mainRun = validRun(verifiedRun) ? verifiedRun : null;
            const artifacts = mainRun ? await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {owner, repo, run_id: mainRun.id, per_page: 100}) : [];
            function exactArtifact(name) {
              if (!name || !mainRun) return null;
              const matches = artifacts.filter(item => item.name === name);
              if (matches.length > 1) throw new Error("Ambiguous artifact name");
              const item = matches[0];
              if (!item) return null;
              const binding = item.workflow_run;
              if (!Number.isSafeInteger(item.id) || item.expired !== false || !/^sha256:[a-f0-9]{64}$/.test(item.digest || "") || !Number.isFinite(Date.parse(item.created_at)) || Date.parse(item.created_at) < Date.parse(mainRun.run_started_at) || binding?.id !== mainRun.id || binding.repository_id !== repoId || binding.head_repository_id !== repoId || binding.head_sha !== mainSha || binding.head_branch !== "main") throw new Error("Artifact identity or freshness mismatch");
              return item;
            }
            const coverage = repositoryRole === "distribution" ? null : exactArtifact(process.env.COVERAGE_ARTIFACT);
            const distributionEvidence = repositoryRole === "distribution" ? exactArtifact(process.env.DISTRIBUTION_EVIDENCE_ARTIFACT) : null;
            if (mainRun) {
              const reread = await readRun();
              const newest = newestRun(await readRuns());
              if (!validRun(reread) || reread.run_started_at !== mainRun.run_started_at || !newest || newest.id !== mainRun.id || newest.workflow_id !== mainRun.workflow_id || newest.created_at !== mainRun.created_at) throw new Error("CI run changed during artifact readback");
            }
            const okMain = Boolean(mainRun);
            const postMerge = repositoryRole === "distribution"
              ? {sha: mainSha, ci: okMain ? "PASS" : "FAIL", distribution_integrity: distributionEvidence ? "PASS" : "FAIL", metadata_validation: distributionEvidence ? "PASS" : "FAIL", governance: okMain ? "PASS" : "FAIL", distribution_artifact_sha: distributionEvidence?.digest || null, workflow_run_ids: mainRun ? [String(mainRun.id)] : []}
              : {sha: mainSha, ci: okMain ? "PASS" : "FAIL", tests: okMain ? "PASS" : "FAIL", lint: okMain ? "PASS" : "FAIL", static_analysis: okMain ? "PASS" : "FAIL", build_validation: okMain ? "PASS" : "FAIL", governance: okMain ? "PASS" : "FAIL", coverage: coverage ? "PASS" : "FAIL", coverage_report_sha: coverage ? mainSha : null, coverage_artifact_sha: coverage?.digest || null, workflow_run_ids: mainRun ? [String(mainRun.id)] : []};
            const request = {
              repository: `${owner}/${repo}`, repository_role: process.env.REPOSITORY_ROLE, main_sha: mainSha, main_parents: commit.data.parents.map(parent => parent.sha), timestamp: new Date().toISOString(),
              originating_pr: pr ? {number: pr.data.number, state: pr.data.merged ? "MERGED" : "OPEN", base_ref: pr.data.base.ref, head_sha: pr.data.head.sha, merge_commit_sha: pr.data.merge_commit_sha, merge_strategy: pr.data.merge_commit_sha === mainSha && commit.data.parents.length === 1 ? "SQUASH" : "MERGE", merge_actor: pr.data.merged_by?.login, merged_at: pr.data.merged_at, changed_files: prFiles.map(file => file.filename), main_changed_files: (commit.data.files || []).map(file => file.filename)} : null,
              pre_merge: pr ? {candidate_sha: pr.data.head.sha, risk_classification: risk, owner_authorization: risk === "HIGH_RISK" ? (ownerStatus?.state === "SUCCESS" ? "PASS" : "FAIL") : "PASS", verification: checkPass("Trusted Delivery qualification / Qualify trusted delivery") ? "PASS" : "FAIL", software_assurance: checkPass("Software Assurance governance / Validate canonical governance policy") ? "PASS" : "FAIL", trusted_delivery: checkPass("Trusted Delivery qualification / Qualify trusted delivery") ? "PASS" : "FAIL", workflow_integrity: checkPass("Trusted Delivery qualification / Qualify trusted delivery") ? "PASS" : "FAIL", required_checks: requiredContexts.size > 0 && [...requiredContexts].every(requiredCheckPass) ? "PASS" : "FAIL"} : null,
              post_merge: postMerge
            };
            const finalSha = (await github.rest.repos.getBranch({owner, repo, branch: "main"})).data.commit.sha;
            if (finalSha !== mainSha) throw new Error("Core main changed during readback");
            fs.writeFileSync("reconciliation-request.json", JSON.stringify(request));

      - name: Evaluate without publishing evidence
        working-directory: reconciliation-policy/policy-snapshots/evidence-ebbb
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          from tools.trusted_delivery.post_merge_reconciliation import reconcile
          result = reconcile(json.loads(Path("../../../reconciliation-request.json").read_text()))
          print("READ_ONLY_DIAGNOSTIC:", result["decision"])
          print("No release, commit status, artifact or qualification record is published.")
          PYCODE
